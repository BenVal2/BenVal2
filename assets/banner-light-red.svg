<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Valenzuela — Full-Stack Developer</title>
  <desc id="desc">Banner claro con acentos rojos, estética de terminal y grilla técnica.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#E5E5E5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#D4D4D4" stroke-width="0.7" opacity="0.7"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="960" height="260" rx="18" fill="url(#bg)"/>
  <rect width="960" height="260" rx="18" fill="url(#grid)"/>
  <ellipse cx="160" cy="30" rx="230" ry="120" fill="#B91C1C" opacity="0.08" filter="url(#soft)"/>
  <ellipse cx="880" cy="250" rx="220" ry="130" fill="#DC2626" opacity="0.08" filter="url(#soft)"/>
  <rect x="0.5" y="0.5" width="959" height="259" rx="18" fill="none" stroke="#D4D4D4"/>
  <rect x="48" y="44" width="4" height="172" rx="2" fill="#B91C1C"/>
  <text x="72" y="72" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" letter-spacing="3" fill="#B91C1C">FULL-STACK DEVELOPER</text>
  <text x="72" y="122" font-family="'Inter', 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#171717">Benjamin Valenzuela</text>
  <text x="72" y="154" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#B91C1C">Next.js · PostgreSQL · TypeScript</text>
  <text x="72" y="184" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#525252">Santiago, Chile · aplicaciones web con datos ordenados</text>
  <g transform="translate(570 42)">
    <rect width="342" height="176" rx="12" fill="#FFFFFF" stroke="#D4D4D4"/>
    <rect width="342" height="30" rx="12" fill="#F5F5F5"/>
    <rect y="18" width="342" height="12" fill="#F5F5F5"/>
    <circle cx="18" cy="15" r="4" fill="#7F1D1D"/>
    <circle cx="34" cy="15" r="4" fill="#DC2626"/>
    <circle cx="50" cy="15" r="4" fill="#EF4444"/>
    <text x="70" y="19" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525252">benjamin@github: ~</text>
    <text x="18" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B91C1C">$</text>
    <text x="34" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#171717">whoami</text>
    <text x="18" y="78" font-family="'JetBrains Mono', monospace" font-size="14" fill="#B91C1C">benjamin.valenzuela</text>
    <text x="18" y="104" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B91C1C">$</text>
    <text x="34" y="104" font-family="'JetBrains Mono', monospace" font-size="11" fill="#171717">cat stack.json</text>
    <text x="18" y="126" font-family="'JetBrains Mono', monospace" font-size="11" fill="#525252">{ "web": "next.js", "data": "postgres" }</text>
    <text x="18" y="150" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B91C1C">● status: building useful things</text>
    <rect x="18" y="160" width="8" height="12" fill="#B91C1C" opacity="0.8"/>
  </g>
  <text x="912" y="236" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="2" fill="#525252">01 / PROFILE</text>
</svg>
