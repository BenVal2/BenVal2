  <text x="36" y="212" font-family="'JetBrains Mono', monospace" font-size="13" fill="#E6F1FF">Aplicaciones web con Next.js, PostgreSQL y TypeScript.</text>
  <text x="36" y="234" font-family="'JetBrains Mono', monospace" font-size="13" fill="#E6F1FF">Interfaces claras, datos ordenados y código mantenible.</text>
